<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Wiola Helper — Powrót do aplikacji</title>
  <meta name="robots" content="noindex">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      padding: 36px 44px;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    h1 { font-size: 1.4rem; margin: 0 0 12px; color: #f1f5f9; }
    p { margin: 8px 0; color: #cbd5e1; line-height: 1.55; }
    code {
      background: rgba(15,23,42,0.6);
      padding: 4px 8px;
      border-radius: 5px;
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 0.85em;
      color: #93c5fd;
    }
    .icon { font-size: 3.2rem; margin-bottom: 4px; }
    .small { font-size: 0.82rem; color: #94a3b8; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Autoryzacja zakończona</h1>
    <p>Wracam do Wiola Helper&hellip;</p>
    <p class="small">
      Jeśli to okno nie zamknie się samo,
      otwórz Wiola Helper, otwórz <strong>Ustawienia → OAuth Login</strong>
      i powtórz logowanie. Możesz zamknąć tę kartę.
    </p>
  </div>
</body>
</html>
